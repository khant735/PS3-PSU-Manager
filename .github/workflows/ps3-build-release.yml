name: PS3 PSU Manager — Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: hldtux/ps3dev:latest
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev/psl1ght
    steps:
      - name: Checkout exact source commit without third-party actions
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test -f Makefile
      - name: Locate PS3 toolchain
        run: |
          set -eu
          for d in /usr/local/ps3dev /opt/ps3dev; do
            if [ -f "$d/psl1ght/ppu_rules" ] || [ -f "$d/ppu_rules" ]; then
              echo "PS3DEV=$d" >> "$GITHUB_ENV"
              if [ -f "$d/psl1ght/ppu_rules" ]; then echo "PSL1GHT=$d/psl1ght" >> "$GITHUB_ENV"; else echo "PSL1GHT=$d" >> "$GITHUB_ENV"; fi
              echo "$d/bin" >> "$GITHUB_PATH"
              echo "$d/ppu/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo 'ERROR: PSL1GHT ppu_rules missing from builder image' >&2
          exit 1
      - name: Compile ELF and generate SELF / PKG
        run: |
          set -eux
          make -j2
          make pkg
          test -s ps3psumanager.elf
          test -s ps3psumanager.self
          test -s ps3psumanager.pkg
      - name: Stage uniquely versioned development binaries and checksums
        run: |
          set -eu
          # Stable versions retain vMAJOR.MINOR; development versions use a
          # separate dev-vMAJOR.MINOR-build.RUN.ATTEMPT namespace.
          DEV_VERSION="dev-v1.63-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp ps3psumanager.elf "dist/PS3-PSU-Manager-${DEV_VERSION}.elf"
          cp ps3psumanager.self "dist/PS3-PSU-Manager-${DEV_VERSION}.self"
          cp ps3psumanager.pkg "dist/PS3-PSU-Manager-${DEV_VERSION}.pkg"
          (cd dist && sha256sum *.elf *.self *.pkg > SHA256SUMS.txt)
      - name: Install GitHub CLI in PS3DEV container
        run: |
          set -eu
          if ! command -v gh >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq gh
          fi
          gh --version
      - name: Publish unique development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Never overwrite existing builds or stable release tags.
          if gh release view "$DEV_VERSION" >/dev/null 2>&1; then
            echo "ERROR: prerelease tag already exists: $DEV_VERSION" >&2
            exit 1
          fi
          gh release create "$DEV_VERSION" \
            "dist/PS3-PSU-Manager-${DEV_VERSION}.elf" \
            "dist/PS3-PSU-Manager-${DEV_VERSION}.self" \
            "dist/PS3-PSU-Manager-${DEV_VERSION}.pkg" \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "PS3 PSU Manager $DEV_VERSION" \
            --notes "Development test build $DEV_VERSION. Source commit: $GITHUB_SHA. Workflow run: $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT. Not a stable release; requires RPCS3 and real PS3 testing." \
            --prerelease
