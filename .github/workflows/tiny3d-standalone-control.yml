name: PS3 PSU Manager — Verified Tiny3D Toolchain Control
on:
  workflow_dispatch:
    inputs:
      sdk_archive_url:
        description: 'HTTPS URL to exact ps3dev_psl1ght_full_toolchain.tar.zst (155 MB)'
        required: true
        type: string
      compiler_archive_url:
        description: 'HTTPS URL to exact ps3dev_ppu_compiler_cgcomp.tar.zst (85 MB)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
      EXPECTED_ELF_SHA256: 8df1a0a87a40157b4a6e40dab36b4e70d6224e075b8e4d77c4f761d128be0f18
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Install archive and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd curl ca-certificates libgmp10 libmpfr6 libmpc3 libelf1
      - name: Download and verify known-working archives
        env:
          SDK_URL: ${{ inputs.sdk_archive_url }}
          COMPILER_URL: ${{ inputs.compiler_archive_url }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for url in "$SDK_URL" "$COMPILER_URL"; do
            case "$url" in https://*) ;; *) echo "Only HTTPS archive URLs accepted" >&2; exit 1;; esac
          done
          curl -fL --retry 3 --max-time 1200 "$SDK_URL" -o sdk.tar.zst
          curl -fL --retry 3 --max-time 1200 "$COMPILER_URL" -o compiler.tar.zst
          echo '034747ab869247ffed67b50a8776779bb7ac65fe1a9ebc0a58a0058aab6f8710  sdk.tar.zst' | sha256sum -c -
          echo '95f8f0a463c0a68177ada128273ec026481ec0b31fce3481c74e0eccb7e12e88  compiler.tar.zst' | sha256sum -c -
          sha256sum sdk.tar.zst compiler.tar.zst > dist/TOOLCHAIN_ARCHIVE_SHA256SUMS.txt
      - name: Install verified PS3DEV tree
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/ps3dev
          sudo tar --zstd -xf sdk.tar.zst -C /usr/local
          sudo tar --zstd -xf compiler.tar.zst -C /usr/local
          sudo chmod -R a+rX /usr/local/ps3dev
          test -x "$PS3DEV/ppu/bin/powerpc64-ps3-elf-g++"
          test -f "$PS3DEV/portlibs/ppu/lib/libtiny3d.a"
          "$PS3DEV/ppu/bin/powerpc64-ps3-elf-g++" --version | head -1
      - name: Audit installed compiler and libraries
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "sdk_sha256=034747ab869247ffed67b50a8776779bb7ac65fe1a9ebc0a58a0058aab6f8710"
            echo "compiler_sha256=95f8f0a463c0a68177ada128273ec026481ec0b31fce3481c74e0eccb7e12e88"
            "$PS3DEV/ppu/bin/powerpc64-ps3-elf-g++" --version | head -1
            for lib in tiny3d font rsx gcm_sys io sysutil rt lv2; do
              find "$PS3DEV" -name "lib${lib}.a" -type f -exec sha256sum '{}' ';'
            done
          } > dist/DEPENDENCY_MANIFEST.txt
      - name: Compile standalone control
        run: |
          set -euo pipefail
          make -C tests/tiny3d_control clean
          make -C tests/tiny3d_control -j2
          cp tests/tiny3d_control/tiny3d_control.elf dist/Tiny3D-Control.elf
          cp tests/tiny3d_control/tiny3d_control.self dist/Tiny3D-Control.self
          cp tests/tiny3d_control/Tiny3D-Control.pkg dist/Tiny3D-Control.pkg
          cp tests/tiny3d_control/tiny3d_control.map dist/CONTROL_LINK_MAP.txt
          "$PS3DEV/ppu/bin/powerpc64-ps3-elf-nm" -n dist/Tiny3D-Control.elf > dist/CONTROL_SYMBOLS.txt
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Gate release on byte-identical working ELF
        run: |
          set -euo pipefail
          echo "$EXPECTED_ELF_SHA256  dist/Tiny3D-Control.elf" | sha256sum -c -
          echo 'ELF exactly matches hardware-verified working reference' > dist/ELF_VERIFICATION.txt
      - name: Publish only verified experimental build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="tiny3d-verified-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Verified Tiny3D $TAG" --notes "Exact known-working ELF hash verified in CI. New PKG still requires real PS3 test." --prerelease
