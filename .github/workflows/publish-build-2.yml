name: Publish successful Build 2 as stable release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-build-2.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve verified Build 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/artifacts/12170273058/zip" > build2.zip
          unzip -o build2.zip -d dist
          test -s dist/PS3-PSU-Manager-v1.63.elf
          test -s dist/PS3-PSU-Manager-v1.63.self
          test -s dist/PS3-PSU-Manager-v1.63.pkg
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Diagnose GitHub token permissions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Workflow permission request: actions=read, contents=write"
          echo "Checking token's repository permissions (never printing the token)..."
          headers="$(mktemp)"
          gh api -i "repos/${GITHUB_REPOSITORY}" > "$headers"
          grep -i '^x-oauth-scopes:\|^x-accepted-oauth-scopes:\|^x-github-request-id:' "$headers" || true
          rm -f "$headers"
          echo "Checking whether token can read repository release metadata..."
          gh api "repos/${GITHUB_REPOSITORY}/releases" --jq 'length'
          echo "Checking repository-level Actions permissions (may require admin rights)..."
          gh api "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" --jq '{default_workflow_permissions,can_approve_pull_request_reviews}' || true
      - name: Publish v1.63 stable release from Build 2
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'RELEASE_TOKEN is missing. Add it under Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
          TAG=v1.63
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target 33e63798f9a417563c4420f93a6a2cccb7179b46 --title "PS3 PSU Manager v1.63 (Build 2)" --notes "Stable GitHub release of successful GitHub Actions Build 2 (run 39218117221). Includes unencrypted ELF, PS3 SELF, installable PKG, and SHA-256 checksums. Compilation and packaging succeeded; real PS3 hardware and live GameFAQs downloads remain unverified." --latest
          fi
